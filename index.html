<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局域网联机房间（稳定版）</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card" id="join-card">
        <h1>局域网联机</h1>
        <p class="subtitle">同一局域网下访问同一个地址即可联机。先输入昵称和房间号。</p>
        <form id="join-form">
          <label for="nickname">昵称</label>
          <input id="nickname" name="nickname" type="text" maxlength="20" placeholder="请输入昵称" autocomplete="off" required />

          <label for="room">房间号</label>
          <input id="room" name="room" type="text" maxlength="20" placeholder="例如：room1" autocomplete="off" required />

          <p class="error" id="error-message" role="alert" aria-live="polite"></p>
          <button type="submit">进入房间</button>
        </form>
      </section>

      <section class="card hidden" id="room-card">
        <div class="room-header">
          <h2 id="room-title">房间</h2>
          <p id="connection-status" class="status status-ok">连接稳定</p>
        </div>

        <p id="welcome-message"></p>

        <div class="layout">
          <div>
            <h3>在线成员</h3>
            <ul id="members" class="members"></ul>
          </div>

          <div>
            <h3>房间消息</h3>
            <div id="messages" class="messages"></div>
            <form id="chat-form" class="chat-form">
              <input id="chat-input" type="text" maxlength="120" placeholder="输入消息并回车发送" autocomplete="off" required />
              <button type="submit">发送</button>
            </form>
          </div>
        </div>

        <button id="leave-btn" class="secondary" type="button">离开房间</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
