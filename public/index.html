<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>唬牌联机</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="lobbyView" class="panel hero-panel">
        <div class="hero-copy">
          <p class="eyebrow">Hu Pai Online</p>
          <h1>网页版唬牌</h1>
          <p class="subcopy">支持自定义人数、房间联机、实时质疑。加入房间前先输入昵称，朋友通过同一个公网地址就能一起开局。</p>
        </div>

        <div class="forms">
          <form id="createForm" class="card">
            <h2>创建房间</h2>
            <label>
              昵称
              <input id="createName" maxlength="16" placeholder="输入昵称后创建房间" required />
            </label>
            <label>
              房间人数
              <input id="maxPlayers" type="number" min="2" max="8" value="4" required />
            </label>
            <button type="submit">创建</button>
          </form>

          <form id="joinForm" class="card">
            <h2>加入房间</h2>
            <label>
              昵称
              <input id="joinName" maxlength="16" placeholder="加入前先输入昵称" required />
            </label>
            <label>
              房间码
              <input id="roomCode" maxlength="5" placeholder="例如 A7K2Q" required />
            </label>
            <button type="submit">加入</button>
          </form>
        </div>
      </section>

      <section id="roomView" class="hidden">
        <div class="topbar">
          <div>
            <p class="eyebrow">房间</p>
            <h2 id="roomTitle">-----</h2>
          </div>
          <div class="topbar-actions">
            <div class="room-meta">
              <div class="badge">
                <span>目标人数</span>
                <strong id="maxPlayersLabel">4</strong>
              </div>
              <div class="badge">
                <span>牌堆</span>
                <strong id="tableCount">0</strong>
              </div>
              <div class="badge">
                <span>本轮牌面</span>
                <strong id="currentRank">待选</strong>
              </div>
            </div>
            <button id="leaveRoomBtn" class="ghost" type="button">退出房间</button>
          </div>
        </div>

        <div class="layout">
          <aside class="panel sidebar">
            <div class="section-head">
              <h3>玩家</h3>
              <button id="startGameBtn" class="secondary">开始游戏</button>
            </div>
            <div id="playersList" class="players-list"></div>
            <form id="renameForm" class="status-card hidden">
              <p class="eyebrow">我的昵称</p>
              <label>
                昵称
                <input id="renameName" maxlength="16" placeholder="大厅阶段可修改昵称" />
              </label>
              <p id="renameHint" class="helper-text">大厅阶段可修改昵称，开局后会锁定。</p>
              <button id="renameBtn" type="submit" class="ghost">修改昵称</button>
            </form>
            <div class="status-card">
              <p class="eyebrow">最近动作</p>
              <p id="lastActionText">等待玩家加入。</p>
            </div>
            <div class="status-card">
              <p class="eyebrow">裁定</p>
              <p id="resolutionText">暂无。</p>
            </div>
          </aside>

          <section class="table-area">
            <div class="panel center-panel">
              <div class="section-head">
                <h3>牌桌</h3>
                <div class="actions">
                  <button id="surrenderBtn" class="danger hidden" type="button">投降</button>
                  <button id="challengeBtn" class="danger">质疑</button>
                  <button id="passBtn" class="secondary">不出</button>
                </div>
              </div>
              <div class="pile-preview">
                <div id="pileCards" class="pile-cards"></div>
              </div>
              <p id="turnText" class="turn-text">等待开始。</p>
            </div>

            <div class="panel play-panel">
              <div class="section-head">
                <h3>出牌</h3>
                <span id="handCount">0 张手牌</span>
              </div>
              <form id="playForm">
                <label>
                  声明牌面
                  <select id="declaredRank"></select>
                </label>
                <div id="selectedInfo" class="selected-info">已选 0 张</div>
                <button type="submit">出牌</button>
              </form>
            </div>

            <div class="panel hand-panel">
              <div class="section-head">
                <h3>我的手牌</h3>
                <button id="clearSelectionBtn" class="ghost" type="button">清空选择</button>
              </div>
              <div id="handCards" class="hand-cards"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="eventOverlay" class="event-overlay hidden" aria-live="polite">
      <div id="eventCard" class="event-card"></div>
    </div>
    <div id="resultModal" class="result-modal hidden" aria-live="polite">
      <div id="resultCard" class="result-card">
        <p class="eyebrow">结算</p>
        <h3 id="resultTitle">本局结束</h3>
        <div id="resultRankings" class="result-rankings"></div>
        <p class="result-hint">点击任意位置关闭</p>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
